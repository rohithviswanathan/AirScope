<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  fill="none"
>
  <!-- Background -->
  <rect
    width="64"
    height="64"
    rx="16"
    fill="#0F151D"
  />

  <!-- Outer air-flow ring -->
  <circle
    cx="32"
    cy="32"
    r="19"
    stroke="#F4F7FA"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="82 38"
    transform="rotate(-35 32 32)"
  />

  <!-- Inner ring -->
  <circle
    cx="32"
    cy="32"
    r="11"
    stroke="#F4F7FA"
    stroke-opacity="0.45"
    stroke-width="2.5"
  />

  <!-- Core -->
  <circle
    cx="32"
    cy="32"
    r="5.5"
    fill="#F97316"
  />

  <!-- Small airflow accent -->
  <circle
    cx="45"
    cy="18"
    r="2.5"
    fill="#22C55E"
  />
</svg>